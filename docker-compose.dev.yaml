services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rfp_evaluator_backend_dev
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
    volumes:
      # Bind mount backend source code for instant uvicorn live-reload
      - ./backend:/app
      # Bind mount data directory for RFPs and responses
      - ./data:/app/data
      # Bind mount frontend so FastAPI can also serve it directly at :8001
      - ./frontend:/app/frontend:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rfp_evaluator_frontend_dev
    ports:
      - "3000:80"
    volumes:
      # Bind mount frontend assets for instant updates on browser refresh
      - ./frontend:/usr/share/nginx/html:ro
      # Bind mount Nginx configuration
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
