<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFP Evaluator AI • Interactive Criteria & Proposal Workbench</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              950: '#070a13',
              900: '#0c111f',
              850: '#111827',
              800: '#172033',
              700: '#23304a',
              600: '#334155',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #17213c 0%, #070a13 80%);
      color: #f1f5f9;
      min-height: 100vh;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(23, 32, 51, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glow-score-5 {
      box-shadow: 0 0 35px -5px rgba(239, 68, 68, 0.35);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .glow-score-4 {
      box-shadow: 0 0 30px -5px rgba(249, 115, 22, 0.3);
      border-color: rgba(249, 115, 22, 0.4);
    }
    .glow-score-3 {
      box-shadow: 0 0 25px -5px rgba(234, 179, 8, 0.3);
      border-color: rgba(234, 179, 8, 0.4);
    }
    .glow-score-2 {
      box-shadow: 0 0 25px -5px rgba(20, 184, 166, 0.25);
      border-color: rgba(20, 184, 166, 0.35);
    }
    .glow-score-1 {
      box-shadow: 0 0 20px -5px rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.35);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    .animate-pulse-slow {
      animation: pulse-slow 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Standard 1-5 Priority Definitions
    const PRIORITY_MARKS = [
      {
        mark: 1,
        title: "Nice to Have",
        subtext: "Optional bonus / non-critical",
        badgeColor: "bg-blue-500/20 text-blue-300 border-blue-500/30",
        activeColor: "bg-blue-500",
        ringColor: "ring-blue-400",
        trackColor: "from-blue-500 to-cyan-500",
        pillActive: "bg-blue-600 text-white border-blue-400",
        tag: "Optional",
        icon: "💡"
      },
      {
        mark: 2,
        title: "Low Priority",
        subtext: "Minor operational convenience",
        badgeColor: "bg-teal-500/20 text-teal-300 border-teal-500/30",
        activeColor: "bg-teal-500",
        ringColor: "ring-teal-400",
        trackColor: "from-blue-500 via-cyan-500 to-teal-500",
        pillActive: "bg-teal-600 text-white border-teal-400",
        tag: "Low",
        icon: "⚡"
      },
      {
        mark: 3,
        title: "Medium Priority",
        subtext: "Standard RFP requirement",
        badgeColor: "bg-amber-500/20 text-amber-300 border-amber-500/30",
        activeColor: "bg-amber-500",
        ringColor: "ring-amber-400",
        trackColor: "from-blue-500 via-teal-500 to-amber-500",
        pillActive: "bg-amber-600 text-gray-950 font-bold border-amber-400",
        tag: "Standard",
        icon: "⚖️"
      },
      {
        mark: 4,
        title: "High Priority",
        subtext: "Critical operational requirement",
        badgeColor: "bg-orange-500/20 text-orange-300 border-orange-500/30",
        activeColor: "bg-orange-500",
        ringColor: "ring-orange-400",
        trackColor: "from-teal-500 via-amber-500 to-orange-500",
        pillActive: "bg-orange-600 text-white border-orange-400",
        tag: "High",
        icon: "🔥"
      },
      {
        mark: 5,
        title: "Must-Have",
        subtext: "Highest priority requirement",
        badgeColor: "bg-rose-500/20 text-rose-300 border-rose-500/30",
        activeColor: "bg-rose-500",
        ringColor: "ring-rose-400",
        trackColor: "from-amber-500 via-orange-500 to-rose-600",
        pillActive: "bg-rose-600 text-white border-rose-400",
        tag: "Must-Have",
        icon: "🚨"
      }
    ];

    function App() {
      // Step 1: RFP & Criteria Extraction State
      const [rfpFile, setRfpFile] = useState(null);
      const [extractingCriteria, setExtractingCriteria] = useState(false);
      const [criteriaReport, setCriteriaReport] = useState(null);
      const [originalCriteria, setOriginalCriteria] = useState(null);
      
      // Step 2: Response & Evaluation State
      const [responseFile, setResponseFile] = useState(null);
      const [evaluatingResponse, setEvaluatingResponse] = useState(false);
      const [progressStep, setProgressStep] = useState(0);
      const [evaluationResult, setEvaluationResult] = useState(null);
      const [level3Result, setLevel3Result] = useState(null);
      const [finalizeMessage, setFinalizeMessage] = useState(null);

      // UI View State
      const [activeTab, setActiveTab] = useState("criteria_slide");
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
      const [viewMode, setViewMode] = useState("slide"); // "slide" or "grid"
      const [scoreFilter, setScoreFilter] = useState("all");
      const [autoPlay, setAutoPlay] = useState(false);
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);

      const rfpInputRef = useRef(null);
      const responseInputRef = useRef(null);

      const progressSteps = [
        "1/3 Sending your tailored criteria priorities (1–5) to Gemini...",
        "2/3 Evaluating vendor proposal compliance against your custom weights...",
        "3/3 Generating customized scorecard, gap analysis & corrected revisions..."
      ];

      // Auto-slide effect
      useEffect(() => {
        let timer;
        const criteriaList = criteriaReport?.criteria || [];
        if (autoPlay && criteriaList.length > 1) {
          timer = setInterval(() => {
            setCurrentSlideIndex((prev) => (prev + 1) % criteriaList.length);
          }, 5000);
        }
        return () => clearInterval(timer);
      }, [autoPlay, criteriaReport]);

      // Keyboard navigation for slides
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (viewMode !== "slide" || activeTab !== "criteria_slide") return;
          const criteriaList = criteriaReport?.criteria || [];
          if (criteriaList.length === 0) return;

          if (e.key === "ArrowRight") {
            setCurrentSlideIndex((prev) => (prev + 1) % criteriaList.length);
          } else if (e.key === "ArrowLeft") {
            setCurrentSlideIndex((prev) => (prev - 1 + criteriaList.length) % criteriaList.length);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [viewMode, activeTab, criteriaReport]);

      // Determine API base URL
      const getApiBase = () => {
        return window.location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8001";
      };

      // -----------------------------------------------------------------
      // STAGE 1: Extract RFP Criteria
      // -----------------------------------------------------------------
      const handleExtractCriteria = async (e) => {
        if (e) e.preventDefault();
        if (!rfpFile) {
          setError("Please select or drop a customer RFP file first.");
          return;
        }

        setError(null);
        setExtractingCriteria(true);

        try {
          const formData = new FormData();
          formData.append("rfp_file", rfpFile);

          const res = await fetch(`${getApiBase()}/api/extract-criteria`, {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `Server error: HTTP ${res.status}`);
          }

          const data = await res.json();
          const report = data.criteria_report || {};
          const preparedCriteria = (report.criteria || []).map((criterion) => {
            const initialPriority = criterion.priority_score ?? criterion.score ?? 3;
            return {
              ...criterion,
              initial_priority: initialPriority,
              confirmed_priority: initialPriority,
              is_user_modified: false,
              is_user_confirmed: false,
            };
          });
          const preparedReport = { ...report, criteria: preparedCriteria };
          setCriteriaReport(preparedReport);
          setOriginalCriteria(JSON.parse(JSON.stringify(preparedCriteria)));
          setEvaluationResult(null);
          setLevel3Result(null);
          setFinalizeMessage(null);
          setCurrentSlideIndex(0);
          setActiveTab("criteria_slide");
        } catch (err) {
          setError(err.message || "Failed to extract criteria from RFP.");
        } finally {
          setExtractingCriteria(false);
        }
      };

      // Instant Sample Criteria Loader
      const handleLoadSampleCriteria = async () => {
        setError(null);
        setExtractingCriteria(true);
        try {
          const res = await fetch(`${getApiBase()}/api/sample/criteria`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const preparedCriteria = (data.criteria || []).map((criterion) => {
            const initialPriority = criterion.priority_score ?? criterion.score ?? 3;
            return {
              ...criterion,
              initial_priority: initialPriority,
              confirmed_priority: initialPriority,
              is_user_modified: false,
              is_user_confirmed: false,
            };
          });
          setCriteriaReport({ ...data, criteria: preparedCriteria });
          setOriginalCriteria(JSON.parse(JSON.stringify(preparedCriteria)));
          setEvaluationResult(null);
          setLevel3Result(null);
          setFinalizeMessage(null);
          setCurrentSlideIndex(0);
          setActiveTab("criteria_slide");
        } catch (err) {
          setError("Failed to load sample criteria: " + err.message);
        } finally {
          setExtractingCriteria(false);
        }
      };

      const handleLoadSampleRfpFile = () => {
        const sampleRfp = `# Request for Proposal • Warehouse Inventory Dashboard\n**Client:** NordFrame Logistics GmbH\n**Industry:** Logistics / Warehousing\n\n## Requirements\n1. Web-based dashboard showing real-time inventory levels across all 6 warehouses.\n2. Automated low-stock alerts sent to warehouse managers when items fall below a configurable threshold.\n3. Integration with the existing PostgreSQL inventory database.\n4. No migration to a new database or replacement of the existing PostgreSQL database.\n5. Role-based access: warehouse managers see only their own site; HQ staff see all sites.\n6. Phased onboarding and rollout across all 6 sites with minimal disruption.\n7. Support and maintenance terms after go-live, including response times and SLAs.\n8. Clear documentation of assumptions, limitations, and risks.\n\n## Budget\n€80,000–€120,000 total, including first year of support.\n\n## Timeline\nWorking pilot at one warehouse within 3 months; full rollout to all 6 sites within 6 months.`;
        const blob = new Blob([sampleRfp], { type: "text/markdown" });
        setRfpFile(new File([blob], "rfp_nordframe.md", { type: "text/markdown" }));
      };

      // -----------------------------------------------------------------
      // CRITERIA INTERACTION: Change Priority Marks (1 - 5)
      // Updates criteria and synchronously triggers live proposal recalculation!
      // -----------------------------------------------------------------
      const handleUpdatePriority = (criterionId, newScore) => {
        if (!criteriaReport?.criteria) return;

        const updatedCriteria = criteriaReport.criteria.map((criterion) => {
          if (criterion.id === criterionId) {
            const markDef = PRIORITY_MARKS[newScore - 1];
            const confirmedPriority = criterion.confirmed_priority
              ?? criterion.priority_score
              ?? criterion.score
              ?? 3;
            const hasChanged = Number(newScore) !== Number(confirmedPriority);
            return {
              ...criterion,
              score: newScore,
              priority_score: newScore,
              priority_level: `${newScore} - ${markDef.title}`,
              is_user_modified: hasChanged,
              is_user_confirmed: !hasChanged,
            };
          }
          return criterion;
        });

        setCriteriaReport({
          ...criteriaReport,
          criteria: updatedCriteria,
        });
        setFinalizeMessage(null);
      };

      const handleUpdateHardGate = (criterionId, confirmed) => {
        if (!criteriaReport?.criteria) return;
        setCriteriaReport({
          ...criteriaReport,
          criteria: criteriaReport.criteria.map((criterion) => criterion.id === criterionId
            ? {
                ...criterion,
                hard_gate: confirmed,
                hard_gate_confirmed_by_user: true,
                is_user_modified: true,
                is_user_confirmed: false,
              }
            : criterion),
        });
      };

      const handleFinalizePriorities = async () => {
        if (!evaluationResult || !criteriaReport?.criteria) return;
        setError(null);
        setEvaluatingResponse(true);
        try {
          const changes = criteriaReport.criteria.map((criterion) => ({
              requirement_id: criterion.id,
              priority: criterion.score || criterion.priority_score || 3,
              hard_gate: criterion.hard_gate ?? null,
              decision: criterion.is_user_confirmed ? "confirmed" : "adjusted",
            }));
          const res = await fetch(`${getApiBase()}/api/level3/finalize`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ level2_evaluation: evaluationResult, changes }),
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `HTTP ${res.status}`);
          }
          const level3Result = await res.json();
          setLevel3Result(level3Result);
          setEvaluationResult((current) => ({
            ...current,
            level3_result: level3Result,
          }));
          setCriteriaReport((current) => current ? ({
            ...current,
            criteria: (current.criteria || []).map((criterion) => ({
              ...criterion,
              score: criterion.score ?? criterion.priority_score ?? 3,
              priority_score: criterion.score ?? criterion.priority_score ?? 3,
              is_user_modified: false,
              is_user_confirmed: true,
              confirmed_priority: criterion.score ?? criterion.priority_score ?? 3,
            })),
          }) : current);
          setFinalizeMessage(`Final review updated: ${level3Result.score}/100 - ${level3Result.readiness}`);
        } catch (err) {
          setError("Failed to finalize priorities: " + err.message);
        } finally {
          setEvaluatingResponse(false);
        }
      };

      const handleResetCriteria = () => {
        if (!originalCriteria || !criteriaReport) return;
        const resetCriteria = JSON.parse(JSON.stringify(originalCriteria)).map((criterion) => {
          const originalPriority = criterion.priority_score ?? criterion.score ?? 3;
          const currentCriterion = criteriaReport.criteria.find((item) => item.id === criterion.id);
          const confirmedPriority = currentCriterion?.confirmed_priority
            ?? currentCriterion?.priority_score
            ?? currentCriterion?.score
            ?? 3;
          const hasChanged = Number(originalPriority) !== Number(confirmedPriority);
          return {
            ...criterion,
            score: originalPriority,
            priority_score: originalPriority,
            confirmed_priority: confirmedPriority,
            is_user_modified: hasChanged,
            is_user_confirmed: !hasChanged,
          };
        });
        setCriteriaReport({
          ...criteriaReport,
          criteria: resetCriteria,
        });
        setFinalizeMessage(null);
      };

      // -----------------------------------------------------------------
      // STAGE 2: Evaluate Response with Custom Criteria
      // 1st: Updates criteria requirement descriptions on frontend with Lite Model
      // 2nd: Starts feedback evaluation with Strong Model
      // -----------------------------------------------------------------
      const handleEvaluateResponse = async (e) => {
        if (e) e.preventDefault();
        if (!responseFile) {
          setError("Please select or drop a vendor proposal response file.");
          return;
        }
        if (!criteriaReport || !criteriaReport.criteria?.length) {
          setError("Please extract or load criteria in Step 1 first.");
          return;
        }

        setError(null);
        setEvaluatingResponse(true);

        // Priority edits are metadata only; Level 2 evaluates the original requirement text.
        const activeCriteriaReport = criteriaReport;
        setProgressStep(1);

        const interval = setInterval(() => {
          setProgressStep((prev) => (prev < progressSteps.length - 1 ? prev + 1 : prev));
        }, 3500);

        try {
          const formData = new FormData();
          formData.append("response_file", responseFile);
          formData.append("criteria_data", JSON.stringify(activeCriteriaReport));

          const res = await fetch(`${getApiBase()}/api/feedback`, {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `Server error: HTTP ${res.status}`);
          }

          const data = await res.json();
          const scorecard = data?.response_feedback?.scorecard;
          if (!Array.isArray(scorecard) || scorecard.length === 0) {
            const rawPreview = data?.response_feedback?.raw_output?.slice?.(0, 300) || "";
            throw new Error(
              "Level 2 returned no scorecard. The AI response may be invalid or truncated. " + rawPreview
            );
          }

          // Level 2 is independently useful; do not hide it behind Level 3 finalization.
          setLevel3Result(null);
          setEvaluationResult(data);
          setFinalizeMessage(null);
          setActiveTab("feedback");

          const initialFinalizeRes = await fetch(`${getApiBase()}/api/level3/finalize`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ level2_evaluation: data, changes: [] }),
          });
          if (!initialFinalizeRes.ok) {
            const level3Error = await initialFinalizeRes.json().catch(() => ({}));
            throw new Error(
              level3Error.detail || `Level 3 finalization failed: HTTP ${initialFinalizeRes.status}`
            );
          }
          const initialLevel3 = await initialFinalizeRes.json();
          setLevel3Result(initialLevel3);
          setEvaluationResult((current) => ({
            ...current,
            level3_result: initialLevel3,
          }));
        } catch (err) {
          setError(err.message || "Failed to evaluate proposal response.");
        } finally {
          clearInterval(interval);
          setEvaluatingResponse(false);
        }
      };

      const handleLoadSampleResponse = (variant = "medium") => {
        let title = "Clarion Data Systems (Variant: MEDIUM)";
        let pricing = "Typical packages €70,000 to €110,000. Firm quote after discovery.";
        let timeline = "Begin with discovery, follow with pilot, and complete rollout in due time.";

        if (variant === "weak") {
          title = "QuickDash GmbH (Variant: WEAK)";
          pricing = "Rough estimate: ~€50,000.";
          timeline = "We can do it quickly in a few weeks.";
        } else if (variant === "strong") {
          title = "Apex Logistics Solutions (Variant: STRONG)";
          pricing = "Fixed price: €98,500 total inclusive of 1-year 24/7 SLA.";
          timeline = "3-month pilot at Munich warehouse, 6-month full 6-site rollout guaranteed.";
        }

        const sampleResp = `# Proposal: Warehouse Visibility Platform for NordFrame Logistics\n**Submitted by:** ${title}\n\n## Technical Solution\n- Real-time inventory dashboard across 6 regional warehouses.\n- Configurable low-stock alerts.\n- Direct integration with existing PostgreSQL database.\n- Role-based access control.\n- Detailed phased migration and onboarding plan.\n\n## Timeline\n${timeline}\n\n## Pricing & SLAs\n${pricing}`;
        const blob = new Blob([sampleResp], { type: "text/markdown" });
        setResponseFile(new File([blob], `response_${variant}.md`, { type: "text/markdown" }));
      };

      const handleLoadInstantFullDemo = async () => {
        setError(null);
        setEvaluatingResponse(true);
        try {
          const res = await fetch(`${getApiBase()}/api/sample`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          setCriteriaReport(data.criteria_report);
          setOriginalCriteria(JSON.parse(JSON.stringify(data.criteria_report?.criteria || [])));
          setEvaluationResult(data);
          setLevel3Result(data.level3_result || null);
          setFinalizeMessage(null);
          setActiveTab("criteria_slide");
        } catch (err) {
          setError("Failed to load demo: " + err.message);
        } finally {
          setEvaluatingResponse(false);
        }
      };

      const copyJson = () => {
        const payload = evaluationResult || criteriaReport;
        if (!payload) return;
        navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      // -----------------------------------------------------------------
      // INTERACTIVE PROPOSAL METRICS & DEAL-BREAKER ENGINE
      // -----------------------------------------------------------------
      const criteriaList = criteriaReport?.criteria || [];
      const currentCriterion = criteriaList[currentSlideIndex] || null;
      const currentScore = currentCriterion ? (currentCriterion.score || currentCriterion.priority_score || 3) : 3;

      const baseScorecard = level3Result?.scorecard
        || evaluationResult?.level3_result?.scorecard
        || evaluationResult?.response_feedback?.scorecard
        || [];

      // Calculate dynamic synchronized scorecard reflecting user's current customized priority marks
      const syncedScorecard = baseScorecard.map((item) => {
        const critMatch = criteriaList.find((c) => (c.id || "").trim().toUpperCase() === (item.criterion_id || "").trim().toUpperCase());
        const hasPendingChange = critMatch?.is_user_modified && !critMatch?.is_user_confirmed;
        const currentCritScore = hasPendingChange
          ? (critMatch.score || critMatch.priority_score || 3)
          : (item.priority_score || (critMatch ? (critMatch.score || critMatch.priority_score || 3) : 3));
        const markDef = PRIORITY_MARKS[currentCritScore - 1] || PRIORITY_MARKS[2];
        const isModified = critMatch?.is_user_modified || false;

        return {
          ...item,
          priority_score: currentCritScore,
          priority_level: `${currentCritScore} - ${markDef.title}`,
          is_user_modified: isModified,
        };
      });

      const weightedResult = level3Result || evaluationResult?.level3_result || null;

      const getScorecardMatch = (reqId) => {
        if (!reqId || !syncedScorecard.length) return null;
        const normalized = reqId.trim().toUpperCase();
        return syncedScorecard.find((s) => (s.criterion_id || "").trim().toUpperCase() === normalized);
      };

      const countMustHave = criteriaList.filter((c) => (c.score || c.priority_score) === 5).length;
      const countHigh = criteriaList.filter((c) => (c.score || c.priority_score) === 4).length;
      const countMedium = criteriaList.filter((c) => (c.score || c.priority_score) === 3).length;
      const countLowNice = criteriaList.filter((c) => (c.score || c.priority_score) <= 2).length;
      const modifiedCount = criteriaList.filter((c) => c.is_user_modified && !c.is_user_confirmed).length;

      const filteredCriteria = criteriaList.filter((c) => {
        if (scoreFilter === "all") return true;
        const sc = c.score || c.priority_score || 3;
        return sc === parseInt(scoreFilter, 10);
      });

      const getGradeBadge = (grade) => {
        if (!grade) return "bg-gray-800 text-gray-300 border-gray-700";
        if (grade.startsWith("A")) return "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
        if (grade.startsWith("B")) return "bg-blue-500/20 text-blue-300 border-blue-500/40";
        if (grade.startsWith("C")) return "bg-amber-500/20 text-amber-300 border-amber-500/40";
        return "bg-rose-500/20 text-rose-300 border-rose-500/40";
      };

      const getComplianceBadge = (statusStr) => {
        if (!statusStr) return null;
        const s = statusStr.toLowerCase();
        if (["addressed", "compliant", "fully addressed", "fully compliant"].includes(s)) {
          return (

                            <th class="py-3 px-4">Requirement</th>
                            <th class="py-3 px-4">Priority (1–5 Selector)</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Evaluation Notes</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-800 bg-dark-900/50">
                          {syncedScorecard.map((item, idx) => {
                            const sc = item.priority_score || 3;
                            return (
                              <tr key={idx} class="hover:bg-dark-800/40 transition-colors">
                                <td class="py-3 px-4 font-mono font-bold text-brand-400 whitespace-nowrap">
                                  {item.criterion_id}
                                </td>
                                <td class="py-3 px-4 font-semibold text-gray-200">
                                  {item.requirement_title}
                                </td>
                                <td class="py-3 px-4 whitespace-nowrap">
                                  <div class="flex items-center gap-1">
                                    {[1, 2, 3, 4, 5].map((m) => (
                                      <button
                                        key={m}
                                        type="button"
                                        onClick={() => handleUpdatePriority(item.criterion_id, m)}
                                        class={`w-6 h-6 rounded text-2xs font-bold transition-all ${
                                          m === sc
                                            ? sc === 5 ? "bg-rose-500 text-white shadow" :
                                              sc === 4 ? "bg-orange-500 text-white shadow" :
                                              sc === 3 ? "bg-amber-500 text-gray-950 shadow" : "bg-blue-500 text-white shadow"
                                            : "bg-dark-800 text-gray-500 hover:text-white border border-gray-700"
                                        }`}
                                        title={`Set priority for ${item.criterion_id} to Mark ${m}`}
                                      >
                                        {m}
                                      </button>
                                    ))}
                                    {item.is_user_modified && (
                                      <span class="text-amber-400 font-bold ml-1 text-2xs">Custom</span>
                                    )}
                                  </div>
                                  {item.confirmed_priority && (
                                    <div class="mt-1 text-3xs text-gray-500 font-mono">
                                      Suggested {item.suggested_priority ?? "-"} → Confirmed {item.confirmed_priority} · Contribution {item.weighted_contribution ?? "-"}
                                    </div>
                                  )}
                                </td>
                                <td class="py-3 px-4 whitespace-nowrap">
                                  {getComplianceBadge(item.status)}
                                  {item.validation_warnings?.length > 0 && (
                                    <div class="mt-1 text-3xs text-amber-300">Manual evidence review</div>
                                  )}
                                </td>
                                <td class="py-3 px-4 text-gray-300 leading-relaxed max-w-md">
                                  {item.evaluation_notes}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* TAB 3: CORRECTED PROPOSAL                                    */}
              {/* ============================================================ */}
              {activeTab === "correction" && evaluationResult && (
                <div class="space-y-6">
                  {/* Draft revisions and vendor confirmation requirements */}
                  <div class="p-5 rounded-xl bg-dark-850 border border-gray-800">
                    <h4 class="text-sm font-bold text-white flex items-center gap-2 mb-3">
                      <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                      Suggested Revisions Requiring Vendor Confirmation
                    </h4>
                    <ul class="space-y-2.5 text-xs text-gray-300">
                      {(evaluationResult.response_correction?.actionable_recommendations || []).map((rec, idx) => (
                        <li key={idx} class="flex items-start gap-2.5 bg-dark-900/60 p-3 rounded-lg border border-gray-800">
                          <span class="w-5 h-5 rounded-full bg-brand-500/20 text-brand-300 flex items-center justify-center shrink-0 text-xs font-bold font-mono">
                            {idx + 1}
                          </span>
                          <span class="pt-0.5">{rec}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* Requirements Revisions / Draft Proposal Details */}
                  {evaluationResult.response_correction?.corrected_proposal && (
                    <div class="p-6 rounded-xl glass-card border border-gray-800">
                      <div class="mb-4 pb-3 border-b border-gray-800">
                        <span class="text-xs uppercase tracking-wider text-brand-400 font-semibold font-mono">Draft Revision - Vendor Confirmation Required</span>
                        <h3 class="text-xl font-bold text-white mt-1">
                          {evaluationResult.response_correction.corrected_proposal.title || "Draft Proposal Revisions"}
                        </h3>
                      </div>

                      {/* Dynamic Requirements Revisions matching criteria priorities */}
                      {Array.isArray(evaluationResult.response_correction.corrected_proposal.requirements_revisions) && evaluationResult.response_correction.corrected_proposal.requirements_revisions.length > 0 ? (
                        <div class="space-y-4 mb-6">
                          <h4 class="text-xs uppercase font-bold text-gray-400 font-mono">Specific Requirement Revisions (Ordered by Priority):</h4>
                          <div class="grid grid-cols-1 gap-3">
                            {evaluationResult.response_correction.corrected_proposal.requirements_revisions.map((rev, idx) => (
                              <div key={idx} class="p-4 rounded-xl bg-dark-850/80 border border-gray-800">
                                <div class="flex items-center justify-between gap-2 mb-2">
                                  <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 font-mono font-bold text-xs">
                                      {rev.criterion_id}
                                    </span>
                                    <h5 class="text-xs font-bold text-white">{rev.requirement_title}</h5>
                                  </div>
                                  <span class="text-2xs font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300">
                                    Priority {rev.priority_score || "Custom"}
                                  </span>
                                </div>
                                {rev.deficiency_resolved && (
                                  <p class="text-2xs text-rose-300/80 italic mb-2">
                                    Original gap: {rev.deficiency_resolved}
                                  </p>
                                )}
                                <p class="text-xs text-gray-200 bg-dark-900/60 p-3 rounded-lg border border-gray-800/80">
                                  {rev.suggested_revision || rev.corrected_solution_text}
                                </p>
                              </div>
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs mb-6">
                          {evaluationResult.response_correction.corrected_proposal.database_integration && (
                            <div class="p-3.5 rounded-lg bg-dark-850/70 border border-gray-800">
                              <span class="text-brand-400 block font-semibold mb-1">Database Integration</span>
                              <p class="text-gray-200">{evaluationResult.response_correction.corrected_proposal.database_integration}</p>
                            </div>
                          )}
                          {evaluationResult.response_correction.corrected_proposal.role_based_access_control && (
                            <div class="p-3.5 rounded-lg bg-dark-850/70 border border-gray-800">
                              <span class="text-brand-400 block font-semibold mb-1">Role-Based Access Control</span>
                              <p class="text-gray-200">{evaluationResult.response_correction.corrected_proposal.role_based_access_control}</p>
                            </div>
                          )}
                          {evaluationResult.response_correction.corrected_proposal.low_stock_alerts && (
                            <div class="p-3.5 rounded-lg bg-dark-850/70 border border-gray-800">
                              <span class="text-brand-400 block font-semibold mb-1">Low-Stock Alerts (REQ-02)</span>
                              <p class="text-gray-200">{evaluationResult.response_correction.corrected_proposal.low_stock_alerts}</p>
                            </div>
                          )}
                          {evaluationResult.response_correction.corrected_proposal.timeline_and_onboarding && (
                            <div class="p-3.5 rounded-lg bg-dark-850/70 border border-gray-800">
                              <span class="text-brand-400 block font-semibold mb-1">Timeline & Rollout</span>
                              <p class="text-gray-200">{evaluationResult.response_correction.corrected_proposal.timeline_and_onboarding}</p>
                            </div>
                          )}
                          {evaluationResult.response_correction.corrected_proposal.support_and_slas && (
                            <div class="p-3.5 rounded-lg bg-dark-850/70 border border-gray-800">
                              <span class="text-brand-400 block font-semibold mb-1">Support, SLAs & Maintenance</span>
                              <p class="text-gray-200">{evaluationResult.response_correction.corrected_proposal.support_and_slas}</p>
                            </div>
                          )}
                        </div>
                      )}

                      {/* Full Proposal Markdown */}
                      {evaluationResult.response_correction.corrected_proposal.full_proposal_markdown && (
                        <div class="mt-4 pt-4 border-t border-gray-800">
                          <h4 class="text-xs uppercase font-bold text-gray-400 mb-2 font-mono">Draft Markdown - Requires Vendor Confirmation</h4>
                          <pre class="p-4 rounded-xl bg-dark-950 font-mono text-xs text-gray-300 overflow-x-auto whitespace-pre-wrap border border-gray-800 max-h-96 custom-scrollbar">
                            {evaluationResult.response_correction.corrected_proposal.full_proposal_markdown}
                          </pre>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* ============================================================ */}
              {/* TAB 4: RAW JSON                                              */}
              {/* ============================================================ */}
              {activeTab === "raw_json" && (
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-xs text-gray-400 font-mono">Current JSON Payload</span>
                    <button
                      type="button"
                      onClick={copyJson}
                      class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-dark-800 hover:bg-dark-700 text-gray-200 border border-gray-700 flex items-center gap-1.5"
                    >
                      {copied ? "✓ Copied!" : "Copy JSON"}
                    </button>
                  </div>
                  <pre class="p-4 rounded-xl bg-dark-950 font-mono text-xs text-gray-300 overflow-x-auto border border-gray-800 max-h-[600px] custom-scrollbar">
                    {JSON.stringify(evaluationResult || criteriaReport, null, 2)}
                  </pre>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
