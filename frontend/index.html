<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFP Evaluator AI • 5-Step Interactive Proposal Scorer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              950: '#070a13',
              900: '#0c111f',
              850: '#111827',
              800: '#172033',
              700: '#23304a',
              600: '#334155',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #070a13;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-panel {
      background: rgba(12, 17, 31, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-card {
      background: rgba(23, 32, 51, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.7);
    }
    .pulse-amber {
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
      }
    }
  </style>
</head>
<body class="min-h-screen bg-dark-950 text-gray-100 selection:bg-brand-500 selection:text-white flex flex-col justify-between">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // -------------------------------------------------------------------------
    // PRIORITY RUBRIC DEFINITIONS (1 - 5)
    // -------------------------------------------------------------------------
        // Marker Icon component: A marker pen drawing a vibrant highlight stroke
    const MarkerIcon = ({ active = true, classNames = "w-4 h-4" }) => (
      <svg
        class={`${classNames} ${active ? "text-yellow-400" : "text-gray-400"} inline-block shrink-0`}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
      >
        <path d="m14 12-8.5 8.5a2.12 2.12 0 1 1-3-3L11 9" />
        <path d="M16 6 18 4a2.12 2.12 0 1 1 3 3l-2 2" />
        <path d="m8 18 3 3" />
        <path
          d="M11 21h9"
          stroke={active ? "#facc15" : "#6b7280"}
          strokeWidth="3.5"
          strokeLinecap="round"
        />
      </svg>
    );

    // 7-Dimension Rubric Constants (Appendix A - FPT Software Track 1 Standard)
    const RUBRIC_ICONS = {
      problem_understanding: "🧠",
      scope_deliverables: "📦",
      pricing_clarity: "💰",
      timeline_clarity: "⏱️",
      completeness: "📑",
      tone_persuasiveness: "🎯",
      risk_transparency: "🛡️",
    };

    const getRubricScoreBadge = (score) => {
      const s = Number(score) || 3;
      if (s >= 5) {
        return {
          label: "Exceptional",
          bg: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
          bar: "bg-emerald-500",
          stars: "★★★★★",
        };
      }
      if (s === 4) {
        return {
          label: "Strong",
          bg: "bg-teal-500/15 text-teal-300 border-teal-500/30",
          bar: "bg-teal-500",
          stars: "★★★★☆",
        };
      }
      if (s === 3) {
        return {
          label: "Adequate",
          bg: "bg-amber-500/15 text-amber-300 border-amber-500/30",
          bar: "bg-amber-500",
          stars: "★★★☆☆",
        };
      }
      if (s === 2) {
        return {
          label: "Marginal",
          bg: "bg-orange-500/15 text-orange-300 border-orange-500/30",
          bar: "bg-orange-500",
          stars: "★★☆☆☆",
        };
      }
      return {
        label: "Deficient",
        bg: "bg-rose-500/15 text-rose-300 border-rose-500/30",
        bar: "bg-rose-500",
        stars: "★☆☆☆☆",
      };
    };

    const PRIORITY_MARKS = [
      {
        mark: 1,
        title: "Optional / Nice-to-Have",
        weight: "Weight: 1.0x",
        badgeColor: "bg-gray-700/60 text-gray-300 border-gray-600",
        pillActive: "bg-gray-700 text-white border-gray-500",
        glow: "border-gray-700 hover:border-gray-500",
        icon: "⚪",
      },
      {
        mark: 2,
        title: "Low Priority",
        weight: "Weight: 1.25x",
        badgeColor: "bg-blue-900/60 text-blue-300 border-blue-700",
        pillActive: "bg-blue-600 text-white border-blue-400",
        glow: "border-blue-900/50 hover:border-blue-500/80",
        icon: "🔵",
      },
      {
        mark: 3,
        title: "Medium / Standard",
        weight: "Weight: 1.5x",
        badgeColor: "bg-teal-900/60 text-teal-300 border-teal-700",
        pillActive: "bg-teal-600 text-white border-teal-400",
        glow: "border-teal-900/50 hover:border-teal-500/80",
        icon: "🟢",
      },
      {
        mark: 4,
        title: "High Priority",
        weight: "Weight: 1.75x",
        badgeColor: "bg-amber-900/60 text-amber-300 border-amber-700",
        pillActive: "bg-amber-600 text-white border-amber-400",
        glow: "border-amber-900/50 hover:border-amber-500/80",
        icon: "🟡",
      },
      {
        mark: 5,
        title: "Critical / Mandatory",
        weight: "Weight: 2.0x",
        badgeColor: "bg-rose-900/60 text-rose-300 border-rose-700",
        pillActive: "bg-rose-600 text-white border-rose-400",
        glow: "border-rose-900/50 hover:border-rose-500/80",
        icon: "🔴",
      },
    ];

    const SAMPLE_SCENARIOS = {
      weak: {
        vendor: "BrightPath Software Solutions",
        name: "BrightPath (Weak / Non-Compliant)",
        desc: "Completely omits mandatory PostgreSQL requirement, no SLAs, generic boilerplate response.",
      },
      medium: {
        vendor: "Clarion Data Systems",
        name: "Clarion (Medium Match)",
        desc: "Baseline benchmark with partial compliance on SLAs and migration details.",
      },
      strong: {
        vendor: "Apex Supply Chain Tech",
        name: "Apex (Strong / Compliant)",
        desc: "High compliance across core database, dashboard, and security specifications.",
      },
      overpromise: {
        vendor: "Vantix AI Solutions",
        name: "Vantix (Overpromising / High Risk)",
        desc: "Unrealistic aggressive commitments without verified architectural evidence.",
      },
    };

    function App() {
      // -----------------------------------------------------------------------
      // NAVIGATION WIZARD STATE (Step 1, 2, 3, 4, 5)
      // -----------------------------------------------------------------------
      const [currentStep, setCurrentStep] = useState(1);

      // STEP 1 STATE: Upload Files
      const [rfpFile, setRfpFile] = useState(null);
      const [responseFile, setResponseFile] = useState(null);
      const [rfpInputMode, setRfpInputMode] = useState("upload"); // 'upload' | 'paste'
      const [responseInputMode, setResponseInputMode] = useState("upload"); // 'upload' | 'paste'
      const [rfpText, setRfpText] = useState("");
      const [responseText, setResponseText] = useState("");
      const [originalProposalText, setOriginalProposalText] = useState("");
      const [selectedScenarioKey, setSelectedScenarioKey] = useState("medium");
      const [extractingCriteria, setExtractingCriteria] = useState(false);

      // STEP 2 STATE: Criteria Review & Adaptation
      const [criteriaReport, setCriteriaReport] = useState(null);
      const [originalCriteria, setOriginalCriteria] = useState([]); // ALWAYS KEPT AS BASELINE
      const [criteriaHistory, setCriteriaHistory] = useState([]); // UNDO STACK FOR IMMEDIATE PREVIOUS STATE
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
      const [highlightKeywords, setHighlightKeywords] = useState(true);
      const [viewMode, setViewMode] = useState("carousel"); // 'carousel' | 'grid'
      const [adaptingDescriptions, setAdaptingDescriptions] = useState(false);
      const [adaptationMessage, setAdaptationMessage] = useState(null);
      const [showAddCritModal, setShowAddCritModal] = useState(false);
      const [showHomeConfirmModal, setShowHomeConfirmModal] = useState(false);
      const [criteriaHasChanges, setCriteriaHasChanges] = useState(false);
      const [isEditingActiveCrit, setIsEditingActiveCrit] = useState(false);
      const [newCritForm, setNewCritForm] = useState({
        title: "",
        category: "Core Functionality",
        score: 4,
        description: "",
        rationale: "",
      });

      // STEP 3 & STEP 4 STATE: Vendor Proposal, Evaluation Feedback & Citations
      const [evaluatingResponse, setEvaluatingResponse] = useState(false);
      const [evaluationResult, setEvaluationResult] = useState(null);
      const [expandAllCitations, setExpandAllCitations] = useState(false);
      const [expandedCitationKeys, setExpandedCitationKeys] = useState({});
      const [selectedFixes, setSelectedFixes] = useState({}); // { [issueId]: boolean }
      const [copiedFixId, setCopiedFixId] = useState(null);

      // STEP 5 STATE: Final Proposal Generation & Download (.md)
      const [customFilename, setCustomFilename] = useState("");

      // Global status / error
      const [error, setError] = useState(null);

      const rfpInputRef = useRef(null);

      // Session hygiene check on mount: guarantee server is clean before starting
      useEffect(() => {
        fetch(`${getApiBase()}/api/session/reset`, { method: "POST" })
          .then((r) => r.json())
          .then((d) => console.log("[Session Hygiene Check]", d))
          .catch((e) => console.warn("[Session Hygiene Check Error]", e));
      }, []);

      const responseInputRef = useRef(null);

      // -----------------------------------------------------------------------
      // API Helper
      // -----------------------------------------------------------------------
      const getApiBase = () => {
        return window.location.port === "3000" ? "" : "http://localhost:8001";
      };

      // -----------------------------------------------------------------------
      // CRITERIA HISTORY (UNDO) HELPER
      // -----------------------------------------------------------------------
      const pushCriteriaHistorySnapshot = () => {
        if (!criteriaReport?.criteria) return;
        const snapshot = JSON.parse(JSON.stringify(criteriaReport));
        setCriteriaHistory((prev) => [...prev.slice(-20), snapshot]);
      };

      const handleUndoCriteriaChange = () => {
        if (criteriaHistory.length === 0) return;
        const previousState = criteriaHistory[criteriaHistory.length - 1];
        const nextHistory = criteriaHistory.slice(0, -1);
        setCriteriaHistory(nextHistory);
        setCriteriaReport(previousState);
        setIsEditingActiveCrit(false);
        setCriteriaHasChanges(nextHistory.length > 0);
        setAdaptationMessage("↩️ Reverted to previous criteria state.");
        setTimeout(() => setAdaptationMessage(null), 3500);
      };

      // -----------------------------------------------------------------------
      // STEP 1 ACTIONS: File Upload & Preset Selection
      // -----------------------------------------------------------------------
      const handleRfpFileSelect = async (file) => {
        if (!file) return;
        setRfpFile(file);
        // Reset downstream evaluation to ensure no stale data reuse
        setCriteriaReport(null);
        setOriginalCriteria([]);
        setCriteriaHistory([]);
        setEvaluationResult(null);
        setSelectedFixes({});
        try {
          const text = await file.text();
          setRfpText(text);
        } catch (e) {
          console.warn("Could not read RFP text:", e);
        }
      };

      const handleResponseFileSelect = async (file) => {
        if (!file) return;
        setResponseFile(file);
        // Reset downstream evaluation to ensure fresh evaluation
        setEvaluationResult(null);
        setSelectedFixes({});
        try {
          const text = await file.text();
          setResponseText(text);
          setOriginalProposalText(text);
        } catch (e) {
          console.warn("Could not read response text:", e);
        }
      };

      
      // Load Sample RFP only for Step 1
      const handleLoadSampleRfp = async () => {
        setError(null);
        try {
          // Reset session artifacts
          await fetch(`${getApiBase()}/api/session/reset`, { method: "POST" }).catch(() => {});
          const res = await fetch(`${getApiBase()}/api/presets/weak`);
          if (!res.ok) throw new Error(`Failed to load RFP preset (HTTP ${res.status})`);
          const data = await res.json();
          const rfpF = new File([data.rfp_content], data.rfp_filename, { type: "text/markdown" });
          setRfpFile(rfpF);
          setRfpText(data.rfp_content);
          setCriteriaReport(null);
          setOriginalCriteria([]);
          setCriteriaHistory([]);
          setEvaluationResult(null);
          setSelectedFixes({});
          setAdaptationMessage("✓ Loaded Sample RFP (NordFrame Logistics). Ready to extract criteria.");
          setTimeout(() => setAdaptationMessage(null), 4000);
        } catch (err) {
          setError("Failed to load sample RFP: " + err.message);
        }
      };

      // Select Preset Proposal for Step 3 evaluation
      const handleSelectProposalPreset = async (presetKey) => {
        setError(null);
        try {
          const res = await fetch(`${getApiBase()}/api/presets/${presetKey}`);
          if (!res.ok) throw new Error(`Failed to load proposal preset '${presetKey}' (HTTP ${res.status})`);
          const data = await res.json();
          const respF = new File([data.response_content], data.response_filename, { type: "text/markdown" });
          setResponseFile(respF);
          setResponseText(data.response_content);
          setOriginalProposalText(data.response_content);
          // Clear downstream evaluation of prior proposal, keeping criteria intact
          setEvaluationResult(null);
          setSelectedFixes({});
          setAdaptationMessage(`✓ Selected proposal: ${data.vendor_name} (${data.variant}). Ready to evaluate!`);
          setTimeout(() => setAdaptationMessage(null), 4000);
        } catch (err) {
          setError("Failed to select proposal: " + err.message);
        }
      };

      // Evaluate another proposal while preserving current RFP & customized criteria
      const handleEvaluateAnotherProposal = async () => {
        try {
          await fetch(`${getApiBase()}/api/session/purge`, { method: "POST" });
        } catch (_) {}
        setEvaluationResult(null);
        setSelectedFixes({});
        setCurrentStep(3);
        setAdaptationMessage("✓ RFP & customized criteria preserved. Select or upload another vendor proposal in Step 3.");
        setTimeout(() => setAdaptationMessage(null), 5000);
      };

      const handleLoadSampleScenario = async (scenarioKey) => {
        setError(null);
        setSelectedScenarioKey(scenarioKey);

        try {
          // 1. Reset server session to purge any stale files before loading fresh scenario
          await fetch(`${getApiBase()}/api/session/reset`, { method: "POST" }).catch(() => {});

          // 2. Fetch authentic raw documents for the selected scenario
          const res = await fetch(`${getApiBase()}/api/presets/${scenarioKey}`);
          if (!res.ok) {
            throw new Error(`Failed to load preset '${scenarioKey}' (HTTP ${res.status})`);
          }
          const data = await res.json();

          // 3. Create real File objects from authentic content
          const realRfp = new File([data.rfp_content], data.rfp_filename, { type: "text/markdown" });
          const realResp = new File([data.response_content], data.response_filename, { type: "text/markdown" });

          setRfpFile(realRfp);
          setResponseFile(realResp);
          setRfpText(data.rfp_content);
          setResponseText(data.response_content);
          setOriginalProposalText(data.response_content);

          // 4. Wipe all downstream evaluation state to guarantee 100% fresh AI evaluation
          setCriteriaReport(null);
          setOriginalCriteria([]);
          setCriteriaHistory([]);
          setEvaluationResult(null);
          setSelectedFixes({});
          setCurrentSlideIndex(0);
          setCurrentStep(1);

          setAdaptationMessage(`✓ Loaded ${data.vendor_name} (${data.variant}). Ready for fresh AI extraction & evaluation.`);
          setTimeout(() => setAdaptationMessage(null), 4000);
        } catch (err) {
          setError("Failed to load scenario: " + err.message);
        }
      };

      const handleProceedToStep2 = async () => {
        let fileToSend = rfpFile;
        if (rfpInputMode === "paste") {
          if (!rfpText || rfpText.trim().length < 20) {
            setError("Please paste the Customer RFP text content (at least 20 characters) before continuing.");
            return;
          }
          fileToSend = new File([rfpText.trim()], "pasted_rfp.md", { type: "text/markdown" });
          setRfpFile(fileToSend);
        } else if (!rfpFile) {
          setError("Please upload a Customer RFP document (.pdf, .md, .txt) before continuing.");
          return;
        }

        setError(null);
        setExtractingCriteria(true);

        try {
          const formData = new FormData();
          formData.append("rfp_file", fileToSend);
          if (rfpInputMode === "paste" && rfpText) {
            formData.append("rfp_text", rfpText);
          }

          const res = await fetch(`${getApiBase()}/api/extract-criteria`, {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `HTTP ${res.status}`);
          }

          const data = await res.json();
          const report = data.criteria_report || {};
          setCriteriaReport(report);
          setOriginalCriteria(JSON.parse(JSON.stringify(report.criteria || [])));
          setCriteriaHistory([]);
          setCurrentSlideIndex(0);
          setCriteriaHasChanges(false);
          setIsEditingActiveCrit(false);
          setCurrentStep(2);
        } catch (err) {
          setError(err.message || "Failed to extract criteria from RFP.");
        } finally {
          setExtractingCriteria(false);
        }
      };

      // -----------------------------------------------------------------------
      // STEP 2 ACTIONS: Review, Slider 1-5, Add, Delete, Edit, Adapt Descriptions
      // -----------------------------------------------------------------------
      const handleUpdatePriority = (criterionId, newScore) => {
        if (!criteriaReport?.criteria) return;

        pushCriteriaHistorySnapshot();

        const updatedCriteria = criteriaReport.criteria.map((c) => {
          if (c.id === criterionId) {
            const markDef = PRIORITY_MARKS[newScore - 1];
            const orig = originalCriteria.find((oc) => oc.id === c.id);
            const origScore = orig ? parseInt(orig.score || orig.priority_score || 3) : null;
            const isDifferentFromBaseline = origScore === null || origScore !== newScore;
            return {
              ...c,
              score: newScore,
              priority_score: newScore,
              priority_level: `${newScore} - ${markDef.title}`,
              is_user_modified: isDifferentFromBaseline,
              is_description_adapted: !isDifferentFromBaseline, // If returned to baseline, no adaptation needed
            };
          }
          return c;
        });

        setCriteriaReport({
          ...criteriaReport,
          criteria: updatedCriteria,
        });
        setCriteriaHasChanges(true);
      };

      const handleUpdateActiveCriterionFields = (field, value) => {
        if (!criteriaReport?.criteria) return;
        const currentList = [...criteriaReport.criteria];
        if (!currentList[currentSlideIndex]) return;

        currentList[currentSlideIndex] = {
          ...currentList[currentSlideIndex],
          [field]: value,
          is_user_modified: true,
          is_description_adapted: false,
        };

        setCriteriaReport({
          ...criteriaReport,
          criteria: currentList,
        });
        setCriteriaHasChanges(true);
      };

      const handleAddCriterion = (e) => {
        if (e) e.preventDefault();
        if (!criteriaReport) return;
        if (!newCritForm.title.trim()) {
          alert("Please enter a requirement title.");
          return;
        }

        pushCriteriaHistorySnapshot();

        const currentList = criteriaReport.criteria || [];
        const nextNum = currentList.length + 1;
        const nextId = `REQ-CUSTOM-${nextNum < 10 ? '0' : ''}${nextNum}`;
        const markScore = parseInt(newCritForm.score) || 4;
        const markDef = PRIORITY_MARKS[markScore - 1];

        const createdItem = {
          id: nextId,
          title: newCritForm.title.trim(),
          category: newCritForm.category.trim() || "Core Functionality",
          score: markScore,
          priority_score: markScore,
          priority_level: `${markScore} - ${markDef.title}`,
          description: newCritForm.description.trim() || `The solution MUST fulfill requirement: ${newCritForm.title.trim()}.`,
          rationale: newCritForm.rationale.trim() || `Custom requirement added by evaluator (Priority level ${markScore}).`,
          is_user_modified: true,
          is_custom_added: true,
          is_description_adapted: false,
        };

        const updated = [...currentList, createdItem];
        setCriteriaReport({
          ...criteriaReport,
          total_criteria: updated.length,
          criteria: updated,
        });
        setCurrentSlideIndex(updated.length - 1);
        setShowAddCritModal(false);
        setCriteriaHasChanges(true);
        setNewCritForm({ title: "", category: "Core Functionality", score: 4, description: "", rationale: "" });
      };

      const handleDeleteCriterion = (criterionId) => {
        if (!criteriaReport?.criteria) return;
        if (!window.confirm(`Are you sure you want to remove criterion ${criterionId} from evaluation?`)) return;

        pushCriteriaHistorySnapshot();

        const updated = criteriaReport.criteria.filter((c) => c.id !== criterionId);
        setCriteriaReport({
          ...criteriaReport,
          total_criteria: updated.length,
          criteria: updated,
        });
        setCriteriaHasChanges(true);
        if (currentSlideIndex >= updated.length && updated.length > 0) {
          setCurrentSlideIndex(updated.length - 1);
        }
      };

      // REQUIREMENT: Backend receives trigger on regenerate button to rewrite criteria descriptions
      const handleAdaptDescriptionsDirectly = async () => {
        if (!criteriaReport?.criteria) return;

        // Compare each criterion against original baseline
        const modifiedItems = criteriaReport.criteria.filter(isCriterionModified);
        if (modifiedItems.length === 0) {
          setAdaptationMessage("ℹ️ All requirements match original RFP specifications. No modifications detected; zero tokens consumed.");
          setTimeout(() => setAdaptationMessage(null), 4500);
          return;
        }

        setError(null);
        setAdaptingDescriptions(true);
        setAdaptationMessage(`⚡ Adapting descriptions for ${modifiedItems.length} modified requirement(s) using Gemini Lite (saving tokens on ${criteriaReport.criteria.length - modifiedItems.length} unchanged requirements)...`);
        
        pushCriteriaHistorySnapshot();

        // Mark only the genuinely modified items with is_user_modified: true
        const criteriaWithFlags = criteriaReport.criteria.map((c) => ({
          ...c,
          is_user_modified: isCriterionModified(c),
        }));

        try {
          const res = await fetch(`${getApiBase()}/api/criteria/adapt-descriptions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              criteria_report: { ...criteriaReport, criteria: criteriaWithFlags },
              rfp_text: rfpText,
              only_modified: true, // STRICTLY ONLY ADAPT MODIFIED CRITERIA TO SAVE TOKENS
            }),
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `HTTP ${res.status}`);
          }
          const data = await res.json();
          if (data.criteria_report) {
            setCriteriaReport(data.criteria_report);
            setCriteriaHasChanges(false);
            setIsEditingActiveCrit(false);
            setAdaptationMessage(`✅ Successfully adapted ${modifiedItems.length} modified requirement(s)! ${criteriaReport.criteria.length - modifiedItems.length} unchanged requirements preserved without consuming tokens.`);
            setTimeout(() => setAdaptationMessage(null), 5000);
          }
        } catch (err) {
          setError("Failed to regenerate descriptions: " + err.message);
        } finally {
          setAdaptingDescriptions(false);
        }
      };

      // STEP 3 -> STEP 4: Proceed to Evaluate Proposal
      const handleProceedToEvaluation = async () => {
        let fileToSend = responseFile;
        if (responseInputMode === "paste") {
          if (!responseText || responseText.trim().length < 20) {
            setError("Please paste the vendor proposal text (at least 20 characters) before evaluating.");
            return;
          }
          fileToSend = new File([responseText.trim()], "pasted_proposal.md", { type: "text/markdown" });
          setResponseFile(fileToSend);
          setOriginalProposalText(responseText.trim());
        } else if (!responseFile) {
          setError("Vendor proposal file not found. Please select, upload, or paste a proposal in Step 3.");
          return;
        }

        if (!criteriaReport || !criteriaReport.criteria?.length) {
          setError("Criteria list is empty. Please verify Step 2.");
          return;
        }

        setError(null);
        setEvaluatingResponse(true);

        try {
          // Clear any stale evaluation result before starting fresh evaluation
          setEvaluationResult(null);

          const formData = new FormData();
          formData.append("response_file", fileToSend);
          if (responseInputMode === "paste" && responseText) {
            formData.append("response_text", responseText);
          }
          // Pass both parameter names to guarantee compatibility with backend
          formData.append("criteria_data", JSON.stringify(criteriaReport));
          formData.append("criteria_json", JSON.stringify(criteriaReport));
          if (rfpFile) {
            formData.append("rfp_file", rfpFile);
          }
          if (rfpInputMode === "paste" && rfpText) {
            formData.append("rfp_text", rfpText);
          }

          const res = await fetch(`${getApiBase()}/api/feedback`, {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `HTTP ${res.status}`);
          }

          const data = await res.json();
          setEvaluationResult(data);

          const initialFixes = {};
          (data.response_feedback?.issues_and_fixes || []).forEach((item, idx) => {
            const k = item.issue_id || `ISSUE-${idx + 1}`;
            initialFixes[k] = true;
          });
          setSelectedFixes(initialFixes);

          setCurrentStep(4);
        } catch (err) {
          setError("Evaluation failed: " + (err.message || "Unknown error occurred"));
        } finally {
          setEvaluatingResponse(false);
        }
      };
      const handleProceedToStep3 = () => setCurrentStep(3);

      // -----------------------------------------------------------------------
      // STEP 4 ACTIONS: Checkbox Fixes & Toggle Citations
      // -----------------------------------------------------------------------
      const handleToggleFixCheckbox = (issueKey) => {
        setSelectedFixes((prev) => ({
          ...prev,
          [issueKey]: !prev[issueKey],
        }));
      };

      const handleSelectAllFixes = (selectAll) => {
        const issues = evaluationResult?.response_feedback?.issues_and_fixes || [];
        const nextState = {};
        issues.forEach((item, idx) => {
          const k = item.issue_id || `ISSUE-${idx + 1}`;
          nextState[k] = selectAll;
        });
        setSelectedFixes(nextState);
      };

      const toggleCitationKey = (key) => {
        setExpandedCitationKeys((prev) => ({
          ...prev,
          [key]: !prev[key],
        }));
      };

      const isCitationTruncated = (quote) => {
        if (!quote) return false;
        // Truncated if length exceeds ~95 chars or contains multiple lines
        return quote.length > 95 || quote.includes("\n");
      };

      const handleCopyFix = (issueKey, text) => {
        navigator.clipboard.writeText(text);
        setCopiedFixId(issueKey);
        setTimeout(() => setCopiedFixId(null), 2500);
      };

      // -----------------------------------------------------------------------
      // STEP 5 ACTIONS: Generate & Download Revised Proposal (.md)
      // -----------------------------------------------------------------------
      const generateRevisedProposalMarkdown = () => {
        const issuesList = evaluationResult?.response_feedback?.issues_and_fixes || [];
        const selectedList = issuesList.filter((item, idx) => {
          const key = item.issue_id || `ISSUE-${idx + 1}`;
          return selectedFixes[key] !== false;
        });

        const vendorName = evaluationResult?.response_feedback?.vendor_name || "Clarion Data Systems";
        const dateStr = new Date().toISOString().split("T")[0];
        const baseDraft = originalProposalText || `# Proposal: Warehouse Visibility Platform for NordFrame Logistics\n\n**Submitted by:** ${vendorName}\n\n## Proposed Solution\nDirect real-time inventory visibility platform across all 6 warehouse sites.`;

        let auditHeader = `# Proposal: Warehouse Visibility Platform for NordFrame Logistics (REVISED DRAFT)\n\n`;
        auditHeader += `**Vendor:** ${vendorName}\n`;
        auditHeader += `**Revision Date:** ${dateStr}\n`;
        auditHeader += `**Refined with:** Proposal Scorer AI\n\n`;
        auditHeader += `> **Revision Summary:** ${selectedList.length} of ${issuesList.length} AI-recommended improvements were reviewed, approved, and integrated into this proposal draft.\n`;
        if (selectedList.length > 0) {
          auditHeader += `>\n`;
          selectedList.forEach((item) => {
            auditHeader += `> - [x] **${item.issue_id || "ISSUE"}** (${item.severity || "Fix"}): ${item.title}\n`;
          });
        }
        auditHeader += `\n---\n\n`;

        let revisedBody = baseDraft;

        selectedList.forEach((item) => {
          const fixText = item.suggested_fix?.rewritten_text || "";
          if (!fixText) return;
          const searchKey = ((item.title || "") + " " + (item.criterion_id || "")).toLowerCase();

          if (searchKey.includes("timeline") || searchKey.includes("schedule") || searchKey.includes("milestone")) {
            if (/##\s*timeline/i.test(revisedBody)) {
              revisedBody = revisedBody.replace(/##\s*timeline[^\n]*\n([\s\S]*?)(?=\n##|$)/i, `## Timeline & Milestone Commitments (Revised)\n${fixText}\n`);
            } else {
              revisedBody += `\n\n## Timeline & Milestone Commitments (Revised)\n${fixText}\n`;
            }
          } else if (searchKey.includes("sla") || searchKey.includes("support") || searchKey.includes("maintenance")) {
            if (/##\s*support/i.test(revisedBody)) {
              revisedBody = revisedBody.replace(/##\s*support[^\n]*\n([\s\S]*?)(?=\n##|$)/i, `## Support & Maintenance SLAs (Revised)\n${fixText}\n`);
            } else {
              revisedBody += `\n\n## Support & Maintenance SLAs (Revised)\n${fixText}\n`;
            }
          } else if (searchKey.includes("risk") || searchKey.includes("assumption")) {
            if (/##\s*(assumptions|risk)/i.test(revisedBody)) {
              revisedBody = revisedBody.replace(/##\s*(assumptions|risk)[^\n]*\n([\s\S]*?)(?=\n##|$)/i, `## Assumptions & Project Risk Management (Revised)\n${fixText}\n`);
            } else {
              revisedBody += `\n\n## Assumptions & Project Risk Management (Revised)\n${fixText}\n`;
            }
          } else if (searchKey.includes("pricing") || searchKey.includes("budget") || searchKey.includes("cost")) {
            if (/##\s*pricing/i.test(revisedBody)) {
              revisedBody = revisedBody.replace(/##\s*pricing[^\n]*\n([\s\S]*?)(?=\n##|$)/i, `## Commercial Pricing & Budget Alignment (Revised)\n${fixText}\n`);
            } else {
              revisedBody += `\n\n## Commercial Pricing & Budget Alignment (Revised)\n${fixText}\n`;
            }
          } else if (searchKey.includes("postgres") || searchKey.includes("database")) {
            if (/##\s*(proposed solution|technical solution)/i.test(revisedBody)) {
              revisedBody = revisedBody.replace(/(database migration|proprietary cloud[^\n]*)/i, "Native PostgreSQL integration (no migration)");
              revisedBody += `\n\n### Database Integration Commitment\n${fixText}\n`;
            } else {
              revisedBody += `\n\n## Database Integration Commitment\n${fixText}\n`;
            }
          } else {
            revisedBody += `\n\n## Revised Section: ${item.title}\n${fixText}\n`;
          }
        });

        return auditHeader + revisedBody;
      };

      const handleDownloadRevisedProposal = () => {
        const mdContent = generateRevisedProposalMarkdown();
        const vendor = (evaluationResult?.response_feedback?.vendor_name || "vendor")
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "_");
        const defaultName = `revised_proposal_${vendor}_${new Date().toISOString().split("T")[0]}.md`;
        const filename = customFilename.trim() || defaultName;

        const blob = new Blob([mdContent], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        alert(`✓ Proposal successfully exported and downloaded: ${filename}`);
      };

      // -----------------------------------------------------------------------
      // 1-CLICK INSTANT DEMO
      // -----------------------------------------------------------------------
      const handleLoadInstantFullDemo = async () => {
        await handleLoadSampleScenario("weak");
      };

      // -----------------------------------------------------------------------
      // COMPUTED / HELPERS
      // -----------------------------------------------------------------------
      const criteriaList = criteriaReport?.criteria || [];
      const currentCriterion = criteriaList[currentSlideIndex] || criteriaList[0] || null;
      const currentScore = currentCriterion?.score || currentCriterion?.priority_score || 3;

      // Lookup original baseline for current criterion
      const originalBaseline = currentCriterion ? originalCriteria.find((oc) => oc.id === currentCriterion.id) : null;
      const originalScore = originalBaseline ? (originalBaseline.score || originalBaseline.priority_score || 3) : null;

      // SMART COMPARISON: Check if criterion differs from original RFP baseline
      const isCriterionModified = (c) => {
        if (!c) return false;
        if (c.is_custom_added) return true;
        const orig = originalCriteria.find((oc) => oc.id === c.id);
        if (!orig) return true;
        const cScore = parseInt(c.score || c.priority_score || 3);
        const oScore = parseInt(orig.score || orig.priority_score || 3);
        if (cScore !== oScore) return true;
        if ((c.title || "").trim() !== (orig.title || "").trim()) return true;
        if ((c.description || "").trim() !== (orig.description || "").trim()) return true;
        if ((c.rationale || "").trim() !== (orig.rationale || "").trim()) return true;
        return false;
      };

      const isCurrentCriterionModified = isCriterionModified(currentCriterion);

      // HAS UNADAPTED CHANGES: Only true if at least one criterion differs from baseline and has not been adapted
      const hasUnadaptedChanges = criteriaList.some(
        (c) => isCriterionModified(c) && !c.is_description_adapted
      );

      const issuesList = evaluationResult?.response_feedback?.issues_and_fixes || [];
      const selectedFixesCount = issuesList.filter((item, idx) => {
        const key = item.issue_id || `ISSUE-${idx + 1}`;
        return selectedFixes[key] !== false;
      }).length;

      // Check if scorecard has any truncated citations
      const scorecardItems = evaluationResult?.response_feedback?.scorecard || [];
      const hasAnyTruncatedCitations = scorecardItems.some((item) => {
        return isCitationTruncated(item.rfp_citation?.quote) || isCitationTruncated(item.proposal_citation?.quote);
      });

            // -----------------------------------------------------------------------
      // KEYWORD HIGHLIGHTER UTILITY
      // -----------------------------------------------------------------------
      const renderHighlightedText = (text, criterion = null) => {
        if (!text || typeof text !== "string") return text || "";
        if (!highlightKeywords) return text;

        const dangerTerms = [
          "omitted",
          "not found",
          "no mention found",
          "deal-breaker",
          "deal breaking",
          "non-compliant",
          "superficial",
          "unsubstantiated",
          "fails to meet",
          "total failure",
        ];

        const domainTerms = [
          "postgresql",
          "postgres",
          "database",
          "real-time",
          "web-based",
          "dashboard",
          "6 warehouses",
          "6 regional",
          "regional warehouse",
          "warehouse managers",
          "hq staff",
          "rbac",
          "role-based access",
          "permissions",
          "low-stock alerts",
          "automated alerts",
          "configurable threshold",
          "low stock",
          "threshold",
          "no migration",
          "zero migration",
          "3 months",
          "6 months",
          "pilot",
          "onboarding",
          "rollout",
          "sla",
          "response times",
          "support terms",
          "maintenance",
          "assumptions",
          "limitations",
          "risks",
          "€80,000",
          "€120,000",
        ];

        if (criterion && criterion.title) {
          criterion.title.split(/[\s,–—\-/]+/).forEach((word) => {
            const w = word.trim().toLowerCase();
            if (w.length >= 4 && !domainTerms.includes(w)) {
              domainTerms.push(w);
            }
          });
        }

        const escapeRegex = (s) => s.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
        const allTerms = [...dangerTerms, ...domainTerms].sort((a, b) => b.length - a.length);
        const pattern = new RegExp(`(${allTerms.map(escapeRegex).join("|")})`, "gi");

        const parts = text.split(pattern);
        if (parts.length <= 1) return text;

        return parts.map((part, i) => {
          const lower = part.toLowerCase();
          const isDanger = dangerTerms.some((dt) => lower.includes(dt));
          const isDomain = domainTerms.some((dt) => lower === dt || lower.includes(dt));

          if (isDanger) {
            return (
              <mark
                key={i}
                class="bg-rose-500/25 text-rose-200 border-b-2 border-rose-500 px-1 py-0.2 rounded font-bold shadow-sm"
              >
                {part}
              </mark>
            );
          } else if (isDomain) {
            return (
              <mark
                key={i}
                class="bg-yellow-400/25 text-yellow-200 border-b-2 border-yellow-400 px-1 py-0.2 rounded font-semibold shadow-sm"
              >
                {part}
              </mark>
            );
          }
          return part;
        });
      };

      const calculateWeightedScore = () => {
        if (evaluationResult?.response_feedback?.overall_score?.weighted_total !== undefined) {
          return evaluationResult.response_feedback.overall_score.weighted_total;
        }
        const items = evaluationResult?.response_feedback?.scorecard || [];
        if (items.length === 0) return 0;
        let total = 0;
        let earned = 0;
        items.forEach((it) => {
          const w = it.priority_score || 3;
          total += w;
          const s = (it.status || "").toLowerCase().trim();
          if (s.includes("non") || s.includes("fail") || s.includes("omit") || s.includes("unmet") || s === "no") {
            earned += 0;
          } else if (s.includes("partial") || s.includes("incomplete") || s.includes("conditional")) {
            earned += w * 0.5;
          } else if (s.includes("compliant") || s.includes("pass") || s.includes("fully") || s.includes("met") || s === "yes") {
            earned += w * 1.0;
          }
        });
        return total > 0 ? Math.round((earned / total) * 100) : 0;
      };

      const getGlowClass = (score) => {
        const mark = PRIORITY_MARKS[score - 1];
        return mark ? mark.glow : "border-gray-700";
      };

      const getComplianceBadge = (status) => {
        const s = (status || "").toLowerCase().trim();
        // Negative / non-compliance checks MUST precede general 'compliant' check
        if (
          s.includes("non") ||
          s.includes("fail") ||
          s.includes("not") ||
          s.includes("omit") ||
          s.includes("unmet") ||
          s === "no"
        ) {
          return (
            <span class="px-2 py-0.5 rounded text-2xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/40">
              NON-COMPLIANT
            </span>
          );
        } else if (s.includes("partial") || s.includes("incomplete") || s.includes("conditional")) {
          return (
            <span class="px-2 py-0.5 rounded text-2xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/40">
              PARTIAL
            </span>
          );
        } else if (s.includes("compliant") || s.includes("pass") || s.includes("fully") || s.includes("met") || s === "yes") {
          return (
            <span class="px-2 py-0.5 rounded text-2xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
              COMPLIANT
            </span>
          );
        } else {
          return (
            <span class="px-2 py-0.5 rounded text-2xs font-bold bg-gray-500/20 text-gray-400 border border-gray-500/40">
              {(status || "UNKNOWN").toUpperCase()}
            </span>
          );
        }
      };

      // -----------------------------------------------------------------------
      // RENDER
      // -----------------------------------------------------------------------
      return (
        <div class="min-h-screen flex flex-col justify-between">
          
          {/* HEADER BAR */}
          <header class="border-b border-gray-800 bg-dark-900/80 backdrop-blur sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between">
              <div
                onClick={() => {
                  if (currentStep > 1) {
                    setShowHomeConfirmModal(true);
                  } else {
                    window.scrollTo({ top: 0, behavior: "smooth" });
                  }
                }}
                class="flex items-center gap-3 cursor-pointer group hover:opacity-90 transition-all select-none"
                title={currentStep > 1 ? "Click to return to Home (Step 1)" : "Proposal Scorer AI"}
              >
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-brand-500/20 group-hover:scale-105 transition-transform">
                  ⚡
                </div>
                <div>
                  <h1 class="text-base font-extrabold text-white flex items-center gap-2">
                    <span class="group-hover:text-brand-300 transition-colors">Proposal Scorer AI</span>
                  </h1>
                  <p class="text-2xs text-gray-400 font-mono">Interactive 5-Step Criteria & Proposal Evaluation Workbench</p>
                </div>
              </div>

              {/* Quick Jump & Instant Demo */}
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onClick={handleLoadInstantFullDemo}
                  disabled={evaluatingResponse}
                  class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500/20 to-orange-500/20 hover:from-amber-500/30 hover:to-orange-500/30 text-amber-300 border border-amber-500/40 text-xs font-bold transition-all flex items-center gap-1.5 shadow"
                  title="Instantly load pre-computed benchmark dataset"
                >
                  <span>⚡ 1-Click Instant Demo</span>
                </button>
              </div>
            </div>
          </header>

          {/* MAIN WRAPPER */}
          <main class="max-w-7xl mx-auto px-4 sm:px-8 mt-6 w-full flex-grow">
            
            {/* WIZARD STEPPER & PROGRESS BAR HEADER */}
            <nav aria-label="Progress" class="mb-8 p-4 rounded-2xl glass-panel border border-gray-800 shadow-xl space-y-3">
              {/* SLICK HORIZONTAL PROGRESS BAR INDICATOR */}
              <div class="px-1">
                <div class="flex items-center justify-between text-3xs font-mono text-gray-400 mb-1.5">
                  <span class="flex items-center gap-1.5 font-bold text-gray-300">
                    <span class="inline-block w-2 h-2 rounded-full bg-brand-400 animate-pulse"></span>
                    <span>WIZARD PROGRESS: STEP {currentStep} OF 5</span>
                  </span>
                  <span class="font-bold text-brand-400">
                    {Math.round((currentStep / 5) * 100)}% COMPLETE
                  </span>
                </div>
                <div class="w-full bg-dark-900 h-1.5 rounded-full overflow-hidden border border-gray-800">
                  <div
                    class="bg-gradient-to-r from-brand-500 via-indigo-500 to-emerald-500 h-full rounded-full transition-all duration-500 ease-out"
                    style={{ width: `${(currentStep / 5) * 100}%` }}
                  />
                </div>
              </div>

              {/* 5-STEP INTERACTIVE NAVIGATION GRID */}
              <ol class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 sm:gap-2.5">
                {[
                  { step: 1, title: "1. Upload RFP", subtitle: "Customer RFP Specs", icon: "📋" },
                  { step: 2, title: "2. Review Criteria", subtitle: "Priorities & Baseline", icon: "🔍" },
                  { step: 3, title: "3. Upload Proposal", subtitle: "Select Vendor Proposal", icon: "📄" },
                  { step: 4, title: "4. Scorecard & Fixes", subtitle: "Compliance & Citations", icon: "📊" },
                  { step: 5, title: "5. Export Proposal", subtitle: "Draft & Download", icon: "📥" },
                ].map((s) => {
                  const isActive = currentStep === s.step;
                  const isCompleted = currentStep > s.step;
                  const canNavigate =
                    s.step === 1 ||
                    (s.step === 2 && criteriaReport) ||
                    (s.step === 3 && criteriaReport) ||
                    (s.step === 4 && evaluationResult) ||
                    (s.step === 5 && evaluationResult);
                  return (
                    <li key={s.step}>
                      <button
                        type="button"
                        onClick={() => {
                          if (canNavigate) {
                            setCurrentStep(s.step);
                          }
                        }}
                        disabled={!canNavigate}
                        class={`w-full text-left p-2.5 sm:p-3 rounded-xl border transition-all flex items-center gap-2.5 ${
                          isActive
                            ? "bg-brand-500/15 border-brand-500 text-white shadow-lg shadow-brand-500/10 ring-1 ring-brand-500/50"
                            : isCompleted
                            ? "bg-emerald-500/10 border-emerald-500/40 text-gray-200 hover:bg-emerald-500/15"
                            : canNavigate
                            ? "bg-dark-900/80 border-gray-700 text-gray-300 hover:border-gray-600"
                            : "bg-dark-900/50 border-gray-800 text-gray-500 opacity-60 cursor-not-allowed"
                        }`}
                      >
                        <div class={`w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center text-xs sm:text-sm font-bold shrink-0 ${
                          isActive
                            ? "bg-brand-500 text-white shadow"
                            : isCompleted
                            ? "bg-emerald-500 text-white shadow"
                            : "bg-dark-800 text-gray-400"
                        }`}>
                          {isCompleted ? "✓" : s.icon}
                        </div>
                        <div class="truncate min-w-0">
                          <div class="text-xs font-black tracking-tight truncate">{s.title}</div>
                          <div class="text-3xs text-gray-400 truncate">{s.subtitle}</div>
                        </div>
                      </button>
                    </li>
                  );
                })}
              </ol>
            </nav>


            {/* ERROR NOTIFICATION */}
            {error && (
              <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/40 text-rose-300 text-xs flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span>⚠️</span>
                  <span>{error}</span>
                </div>
                <button type="button" onClick={() => setError(null)} class="text-rose-400 hover:text-white font-bold ml-4">✕</button>
              </div>
            )}

            {/* ADAPTATION STATUS TOAST */}
            {adaptationMessage && (
              <div class="mb-6 p-4 rounded-xl bg-indigo-500/15 border border-indigo-500/40 text-indigo-200 text-xs flex items-center gap-2 animate-bounce">
                <span>✨</span>
                <span>{adaptationMessage}</span>
              </div>
            )}

            {/* ================================================================= */}
            {/* STEP 1: UPLOAD CUSTOMER RFP ONLY (REUSABLE ACROSS MULTIPLE PROPOSALS) */}
            {/* ================================================================= */}
            {currentStep === 1 && (
              <div class="space-y-6 animate-fadeIn">
                <div class="p-6 rounded-2xl glass-panel border border-gray-800">
                  <div class="max-w-2xl mb-6">
                    <span class="px-2.5 py-0.5 rounded text-2xs font-mono font-bold bg-brand-500/20 text-brand-300 border border-brand-500/30">
                      STEP 1: UPLOAD CUSTOMER RFP
                    </span>
                    <h2 class="text-xl font-black text-white mt-2">Upload Tender Specifications</h2>
                    <p class="text-xs text-gray-400 mt-1">
                      Upload the Customer RFP document once. The system will extract and structure the core evaluation criteria in Step 2. You can then evaluate multiple vendor proposals in Step 3 against these same criteria without re-analyzing the RFP.
                    </p>
                  </div>

                  {/* QUICK SAMPLE RFP SELECTOR BAR */}
                  <div class="p-4 rounded-xl bg-dark-900/80 border border-gray-800 mb-6 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <span class="text-xs text-gray-300 font-semibold flex items-center gap-1.5">
                        <span>📋 Pre-load Official Sample RFP:</span>
                      </span>
                      <p class="text-3xs text-gray-500 mt-0.5 font-mono">NordFrame Logistics Cross-Docking & Inventory RFP</p>
                    </div>
                    <button
                      type="button"
                      onClick={handleLoadSampleRfp}

          {/* ADD CRITERION MODAL */}
          {showAddCritModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-dark-850 border border-gray-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl animate-fadeIn">
                <div class="flex items-center justify-between pb-3 mb-4 border-b border-gray-800">
                  <h3 class="text-base font-black text-white flex items-center gap-2">
                    <span>➕ Add Custom Evaluation Criterion</span>
                  </h3>
                  <button type="button" onClick={() => setShowAddCritModal(false)} class="text-gray-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleAddCriterion} class="space-y-4 text-xs">
                  <div>
                    <label class="block text-gray-300 font-semibold mb-1">Requirement Title *</label>
                    <input
                      type="text"
                      required
                      value={newCritForm.title}
                      onChange={(e) => setNewCritForm({ ...newCritForm, title: e.target.value })}
                      placeholder="e.g. Disaster Recovery and 99.9% Uptime Commitment"
                      class="w-full px-3 py-2 rounded-lg bg-dark-900 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-gray-300 font-semibold mb-1">Category</label>
                      <input
                        type="text"
                        value={newCritForm.category}
                        onChange={(e) => setNewCritForm({ ...newCritForm, category: e.target.value })}
                        placeholder="e.g. Core Functionality, Security, SLA"
                        class="w-full px-3 py-2 rounded-lg bg-dark-900 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500"
                      />
                    </div>
                    <div>
                      <label class="block text-gray-300 font-semibold mb-1">Priority Level (1 - 5)</label>
                      <select
                        value={newCritForm.score}
                        onChange={(e) => setNewCritForm({ ...newCritForm, score: e.target.value })}
                        class="w-full px-3 py-2 rounded-lg bg-dark-900 border border-gray-700 text-white focus:outline-none focus:border-brand-500"
                      >
                        <option value="1">Level 1 - Optional (1.0x)</option>
                        <option value="2">Level 2 - Low Priority (1.25x)</option>
                        <option value="3">Level 3 - Medium / Standard (1.5x)</option>
                        <option value="4">Level 4 - High Priority (1.75x)</option>
                        <option value="5">Level 5 - Critical / Mandatory (2.0x)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label class="block text-gray-300 font-semibold mb-1">Detailed Requirement Description</label>
                    <textarea
                      rows="2"
                      value={newCritForm.description}
                      onChange={(e) => setNewCritForm({ ...newCritForm, description: e.target.value })}
                      placeholder="Specific technical or business deliverables expected from the vendor..."
                      class="w-full px-3 py-2 rounded-lg bg-dark-900 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label class="block text-gray-300 font-semibold mb-1">Scoring Rationale</label>
                    <textarea
                      rows="2"
                      value={newCritForm.rationale}
                      onChange={(e) => setNewCritForm({ ...newCritForm, rationale: e.target.value })}
                      placeholder="Why this requirement is essential for customer business objectives..."
                      class="w-full px-3 py-2 rounded-lg bg-dark-900 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <div class="pt-3 border-t border-gray-800 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowAddCritModal(false)}
                      class="px-4 py-2 rounded-lg bg-dark-800 hover:bg-dark-700 text-gray-300 font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      class="px-5 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-bold"
                    >
                      ➕ Add to Criteria List
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* RETURN TO HOME CONFIRMATION DIALOG */}
          {showHomeConfirmModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
              <div class="bg-dark-850 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl animate-scaleUp">
                <div class="flex items-start gap-3.5 mb-4">
                  <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center justify-center text-xl shrink-0">
                    ⚠️
                  </div>
                  <div>
                    <h3 class="text-base font-extrabold text-white">Return to Home Screen?</h3>
                    <p class="text-xs text-gray-400 font-mono mt-0.5">Current Progress: Step {currentStep} of 5</p>
                  </div>
                </div>

                <p class="text-xs text-gray-300 leading-relaxed mb-6 bg-dark-900/60 p-3.5 rounded-xl border border-gray-800">
                  Are you sure you want to return to Step 1? All your current analysis, customized criteria, and evaluation data in this session will be lost if you confirm.
                </p>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-800">
                  <button
                    type="button"
                    onClick={() => setShowHomeConfirmModal(false)}
                    class="px-4 py-2 rounded-xl bg-dark-800 hover:bg-dark-700 text-gray-300 font-bold text-xs border border-gray-700 transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={async () => {
                      setShowHomeConfirmModal(false);
                      try {
                        await fetch(`${getApiBase()}/api/session/reset`, { method: "POST" });
                      } catch (_) {}
                      setCriteriaReport(null);
                      setOriginalCriteria([]);
                      setCriteriaHistory([]);
                      setEvaluationResult(null);
                      setSelectedFixes({});
                      setCurrentStep(1);
                      setAdaptationMessage("✓ Returned to Step 1. Session data cleanly wiped.");
                      setTimeout(() => setAdaptationMessage(null), 4000);
                    }}
                    class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-xs shadow-lg shadow-rose-600/30 transition-all flex items-center gap-1.5"
                  >
                    <span>Yes, Return to Step 1</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="mt-12 py-4 border-t border-gray-800/80 text-center text-xs text-gray-500">
            <div class="max-w-7xl mx-auto px-4 flex items-center justify-center">
              <span>Proposal Scorer AI • Automated RFP & Proposal Intelligence Platform</span>
              
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
